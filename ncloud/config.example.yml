ncloud:
  access_key: "YOUR_ACCESS_KEY"
  secret_key: "YOUR_SECRET_KEY"

# 리스닝 주소/경로는 실행 인자로 지정합니다.
#   ./ncloud_exporter --config config.yml --web.listen-address=:9850

namespaces:
  # metrics를 지정하면 해당 메트릭만 수집합니다.
  #   - name         : Cloud Insight 메트릭명. '*' 와일드카드 사용 가능, 대소문자 무시
  #   - aggregations : AVG / MAX / MIN / SUM / COUNT 중 선택 (미지정 시 namespace 기본값)
  # metrics를 아예 생략하면 해당 네임스페이스의 모든 메트릭을 수집합니다.
  - name: "ncloud.vserver"
    enabled: true
    regions: ["KR"]        # 빈 배열이면 전체 리전
    interval: "Min5"       # Min1 | Min5 | Min30 | Hour2 | Day1 (기본 Min5)
    aggregations: ["AVG"]  # 이 네임스페이스의 기본 aggregation
    metrics:
      - name: "avg_cpu_used_rto"
        aggregations: ["AVG", "MAX"]
      - name: "mem_usert"
      - name: "avg_fs_usert"
      - name: "avg_rcv_bps"
      - name: "avg_snd_bps"
      - name: "load_average_*"   # 1m / 5m / 15m 전부 매칭

  - name: "ncloud.vloadbalancer"
    enabled: false
    regions: []

  - name: "ncloud.vautoscaling"
    enabled: false
    regions: []

  - name: "ncloud.vmysql"
    enabled: false
    regions: []

  - name: "ncloud.vpostgresql"
    enabled: false
    regions: []

  - name: "ncloud.vredis"
    enabled: false
    regions: []

  - name: "ncloud.vmongodb"
    enabled: false
    regions: []

  - name: "ncloud.vmssql"
    enabled: false
    regions: []

  - name: "ncloud.vnks"
    enabled: false
    regions: []

  - name: "ncloud.vsearchengine"
    enabled: false
    regions: []

  - name: "ncloud.vhadoop"
    enabled: false
    regions: []
