ncloud:
  access_key: "YOUR_ACCESS_KEY"
  secret_key: "YOUR_SECRET_KEY"

# 리스닝 주소/경로는 실행 인자로 지정합니다.
#   ./ncloud_exporter --config config.yml --web.listen-address=:9850

namespaces:
  # metrics를 지정하면 해당 메트릭만 수집합니다.
  #   - name         : Cloud Insight 메트릭명. '*' 와일드카드 사용 가능, 대소문자 무시
  #   - aggregations : AVG / MAX / MIN / SUM / COUNT 중 선택 (미지정 시 namespace 기본값)
  # metrics를 아예 생략하면 해당 네임스페이스의 모든 메트릭을 수집합니다.
  #
  # 전체 메트릭 목록과 설정 방법은 docs/metrics.md 참고

  # VPC Server — 기본값은 서버 모니터링에 일반적으로 필요한 16개 시리즈입니다.
  # (필터 없이 전체 수집하면 인스턴스당 125개)
  - name: "ncloud.vserver"
    enabled: true
    regions: ["KR"]          # 빈 배열이면 전체 리전
    interval: "Min5"         # Min1 | Min5 | Min30 | Hour2 | Day1
    aggregations: ["AVG"]    # 아래 metrics의 기본 aggregation
    metrics:
      # CPU
      - name: "avg_cpu_used_rto"     # CPU 사용률 (%)
      - name: "max_cpu_used_rto"     # CPU 사용률 피크 (%)
        aggregations: ["MAX"]
      - name: "load_average_1m"      # CPU load 1분
      - name: "load_average_5m"      # CPU load 5분
      - name: "load_average_15m"     # CPU load 15분

      # 메모리
      - name: "mem_usert"            # 메모리 사용률 (%)
        aggregations: ["AVG", "MAX"]
      - name: "swap_usert"           # swap 사용률 (%)

      # 파일시스템
      - name: "avg_fs_usert"         # 파일시스템 사용률 (%)
      - name: "max_fs_usert"         # 파일시스템 사용률 피크 (%)
        aggregations: ["MAX"]

      # 네트워크
      - name: "avg_rcv_bps"          # 수신 (bits/sec)
      - name: "avg_snd_bps"          # 송신 (bits/sec)

      # 디스크 I/O
      - name: "avg_read_byt_cnt"     # 읽기 (bytes/sec)
      - name: "avg_write_byt_cnt"    # 쓰기 (bytes/sec)
      - name: "avg_read_cnt"         # 읽기 횟수 (num/sec)
      - name: "avg_write_cnt"        # 쓰기 횟수 (num/sec)

      # 필요 시 주석 해제
      # - name: "avg_rcv_pps"        # 수신 패킷 (packets/sec)
      # - name: "avg_snd_pps"        # 송신 패킷 (packets/sec)
      # - name: "max_*_bps"          # 네트워크 순간 피크
      #   aggregations: ["MAX"]

  # 아래 서비스는 metrics를 지정하지 않았으므로, enabled: true로 켜면
  # 해당 서비스의 모든 메트릭 x 모든 aggregation을 수집합니다.
  # 메트릭 목록 확인 방법은 docs/metrics.md 참고
  - name: "ncloud.vloadbalancer"
    enabled: false
    regions: []

  - name: "ncloud.vautoscaling"
    enabled: false
    regions: []

  - name: "ncloud.vmysql"
    enabled: false
    regions: []

  - name: "ncloud.vpostgresql"
    enabled: false
    regions: []

  - name: "ncloud.vredis"
    enabled: false
    regions: []

  - name: "ncloud.vmongodb"
    enabled: false
    regions: []

  - name: "ncloud.vmssql"
    enabled: false
    regions: []

  - name: "ncloud.vnks"
    enabled: false
    regions: []

  - name: "ncloud.vsearchengine"
    enabled: false
    regions: []

  - name: "ncloud.vhadoop"
    enabled: false
    regions: []
