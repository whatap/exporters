credentials:
  subscription_id: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  tenant_id: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  client_id: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  client_secret: xxxxxxxxxxxxxxxxxxxxxxxxxxxx

targets:
  # No aggregations specified: collects all (Total/Average/Minimum/Maximum)
  - resource: /resourceGroups/openmetrics/providers/Microsoft.DBforPostgreSQL/flexibleServers/myserver
    metrics:
      - name: cpu_percent
      - name: memory_percent

  # Resource-level aggregation: applies to all metrics as fallback
  - resource: /resourceGroups/openmetrics/providers/Microsoft.DBforPostgreSQL/flexibleServers/myserver
    aggregations:
      - Average
    metrics:
      - name: cpu_percent
      - name: memory_percent

  # Per-metric aggregation: different aggregations for each metric within the same resource
  - resource: /resourceGroups/openmetrics/providers/Microsoft.DBforPostgreSQL/flexibleServers/myserver
    aggregations:
      - Average
    metrics:
      - name: cpu_percent              # -> Average (resource-level fallback)
      - name: memory_percent           # -> Average (resource-level fallback)
      - name: storage_percent
        aggregations:
          - Maximum                    # -> Maximum (metric-level override)
      - name: iops
        aggregations:
          - Total
          - Maximum                    # -> Total, Maximum (metric-level override)

  # Split targets when exceeding 20 metrics per target
  - resource: /resourceGroups/openmetrics/providers/Microsoft.DBforPostgreSQL/flexibleServers/myserver
    aggregations:
      - Maximum
    metrics:
      - name: storage_percent
      - name: iops
      # ... up to 20 metrics per target

resource_groups:
  - resource_group: "webapps"
    resource_types:
      - "Microsoft.Compute/virtualMachines"
    resource_name_include_re:
      - "testvm.*"
    resource_name_exclude_re:
      - "testvm12"
    metrics:
      - name: "CPU Credits Consumed"
        aggregations:
          - "Average"

resource_tags:
  - resource_tag_name: "monitoring"
    resource_tag_value: "enabled"
    resource_types:
      - "Microsoft.Compute/virtualMachines"
    metrics:
      - name: "CPU Credits Consumed"
        aggregations:
          - "Average"
          - "Maximum"
