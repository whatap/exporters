credentials:
  subscription_id: <secret>
  client_id: <secret>
  client_secret: <secret>
  tenant_id: <secret>

targets:
  - resource: "/resourceGroups/blog-group/providers/Microsoft.Web/sites/blog"
    metrics:
      - name: "BytesReceived"
        aggregations:
          - "Total"
          - "Average"
      - name: "BytesSent"
        aggregations:
          - "Total"
  - resource: "/resourceGroups/app-group/providers/Microsoft.Web/sites/app"
    # resource-level aggregation: used as fallback for metrics without their own aggregations
    aggregations:
      - "Average"
    metrics:
      - name: "Http2xx"
      - name: "Http5xx"
        aggregations:
          - "Total"
          - "Maximum"
  - resource: "/resourceGroups/vm-group/providers/Microsoft.Compute/virtualMachines/vm"
    metric_namespace: "Azure.VM.Windows.GuestMetrics"
    metrics:
    - name: 'Process\Thread Count'
      aggregations:
        - "Average"
        - "Maximum"

resource_groups:
  - resource_group: "webapps"
    resource_types:
      - "Microsoft.Compute/virtualMachines"
    resource_name_include_re:
      - "testvm.*"
    resource_name_exclude_re:
      - "testvm12"
    metrics:
      - name: "CPU Credits Consumed"
        aggregations:
          - "Average"

resource_tags:
  - resource_tag_name: "monitoring"
    resource_tag_value: "enabled"
    resource_types:
      - "Microsoft.Compute/virtualMachines"
    metrics:
      - name: "CPU Credits consumed"
        aggregations:
          - "Average"
          - "Maximum"
