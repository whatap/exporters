---
active_directory_authority_url: "https://login.microsoftonline.com/"
resource_manager_url: "https://management.azure.com/"
credentials:
  subscription_id: <secret>
  client_id: <secret>
  client_secret: <secret>
  tenant_id: <secret>

targets:
  - resource: "/resourceGroups/{resource_group}/providers/Microsoft.Cache/redis/{resource_name}"
    aggregations:
      - Maximum
    metrics:
      - name: "allusedmemorypercentage"
      - name: "allusedmemory"
      - name: "allserverLoad"
      - name: "allconnectedclients"
      - name: "allConnectionsCreatedPerSecond"
      - name: "allConnectionsClosedPerSecond"
      - name: "usedmemorypercentage"
      - name: "usedmemory"
      - name: "serverLoad"
      - name: "connectedclients"
      - name: "allcachehits"
        aggregations: [Total]
      - name: "allcachemisses"
        aggregations: [Total]
      - name: "allevictedkeys"
        aggregations: [Total]
      - name: "allexpiredkeys"
        aggregations: [Total]
      - name: "allgetcommands"
        aggregations: [Total]
      - name: "allsetcommands"
        aggregations: [Total]
      - name: "cachehits"
        aggregations: [Total]
      - name: "cachemisses"
        aggregations: [Total]
      - name: "evictedkeys"
        aggregations: [Total]
      - name: "expiredkeys"
        aggregations: [Total]
      - name: "getcommands"
        aggregations: [Total]
      - name: "setcommands"
        aggregations: [Total]
